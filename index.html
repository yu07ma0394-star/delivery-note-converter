<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>納品書データ変換</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2C3E50;
            --accent: #C9A961;
            --bg: #F8F6F3;
            --surface: #FFFFFF;
            --text: #1A1A1A;
            --text-light: #6B7280;
            --border: #E5E3DE;
            --shadow: rgba(44, 62, 80, 0.08);
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(44, 62, 80, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 300;
            margin-top: 24px;
            letter-spacing: 0.05em;
        }

        .upload-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 24px var(--shadow);
            margin-bottom: 40px;
            border: 1px solid var(--border);
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .upload-area {
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.02) 0%, transparent 100%);
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
            border-radius: 12px;
        }

        .upload-area:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.12);
        }

        .upload-area:hover::before {
            opacity: 0.05;
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 300;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 24px;
            padding: 20px;
            background: rgba(201, 169, 97, 0.08);
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .file-info.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #34495E 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 62, 80, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            display: none;
            animation: fadeInUp 0.8s ease-out;
        }

        .results-section.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow);
            border-left: 4px solid var(--accent);
            animation: scaleIn 0.5s ease-out backwards;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(4) {
            animation-delay: 0.3s;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Libre Baskerville', serif;
        }

        .table-wrapper {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 4px 24px var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead {
            background: linear-gradient(135deg, var(--primary) 0%, #34495E 100%);
            color: white;
        }

        th {
            padding: 18px 16px;
            text-align: left;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        th:nth-child(1) { width: 10%; }  /* 注文日 */
        th:nth-child(2) { width: 15%; } /* 注文ID */
        th:nth-child(3) { width: 25%; } /* お届け先情報 */
        th:nth-child(4) { width: 45%; } /* 商品詳細 */
        th:nth-child(5) { width: 5%; }  /* 数量 */

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(201, 169, 97, 0.04);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .amount {
            font-weight: 600;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .upload-section {
                padding: 32px 24px;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 12px 8px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        /* 印刷用スタイル */
        @media print {
            body {
                background: white;
            }

            body::before {
                display: none;
            }

            .container {
                max-width: 100%;
                padding: 10px;
            }

            .upload-section,
            .controls,
            .loading,
            header,
            .stats {
                display: none !important;
            }

            .results-section {
                display: block !important;
            }

            .table-wrapper {
                box-shadow: none;
                border: 1px solid #000;
            }

            table {
                page-break-inside: auto;
                font-size: 8pt;
            }

            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }

            thead {
                display: table-header-group;
                background: #2C3E50 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            th {
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 8px 4px;
                font-size: 8pt;
            }

            /* 印刷用の列幅調整 */
            th:nth-child(1), td:nth-child(1) { width: 8% !important; }  /* 注文日 */
            th:nth-child(2), td:nth-child(2) { width: 12% !important; } /* 注文ID */
            th:nth-child(3), td:nth-child(3) { width: 22% !important; } /* お届け先情報 */
            th:nth-child(4), td:nth-child(4) { width: 50% !important; } /* 商品詳細 */
            th:nth-child(5), td:nth-child(5) { width: 8% !important; }  /* 数量 */

            td {
                font-size: 7pt;
                padding: 6px 4px;
            }

            tbody tr:hover {
                background: transparent;
            }

            .amount {
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>納品書データ変換</h1>
            <p class="subtitle">PDF納品書を一覧表に変換</p>
        </header>

        <div class="upload-section">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📄</div>
                <div class="upload-text">PDFファイルを選択</div>
                <div class="upload-hint">クリックしてファイルを選択してください</div>
            </div>
            <input type="file" id="fileInput" accept=".pdf" multiple>
            <div class="file-info" id="fileInfo"></div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="convertBtn" disabled>変換する</button>
            <button class="btn-secondary" id="exportBtn" disabled>Excelエクスポート</button>
            <button class="btn-secondary" id="printBtn" disabled>印刷</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>PDFを解析中...</p>
        </div>

        <div class="results-section" id="results">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">総注文数</div>
                    <div class="stat-value" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">総売上</div>
                    <div class="stat-value" id="totalSales">¥0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">総送料</div>
                    <div class="stat-value" id="totalShipping">¥0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">商品小計</div>
                    <div class="stat-value" id="totalProducts">¥0</div>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>注文日</th>
                            <th>注文ID</th>
                            <th>お届け先情報</th>
                            <th>商品詳細</th>
                            <th>数量</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let extractedData = [];
        let selectedFiles = [];

        document.getElementById('fileInput').addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            const fileInfo = document.getElementById('fileInfo');
            
            if (selectedFiles.length > 0) {
                fileInfo.innerHTML = `
                    <strong>${selectedFiles.length}個のファイルを選択しました</strong><br>
                    ${selectedFiles.map(f => f.name).join('<br>')}
                `;
                fileInfo.classList.add('active');
                document.getElementById('convertBtn').disabled = false;
            } else {
                fileInfo.classList.remove('active');
                document.getElementById('convertBtn').disabled = true;
            }
        });

        document.getElementById('convertBtn').addEventListener('click', async () => {
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            extractedData = [];

            for (const file of selectedFiles) {
                await processPDF(file);
            }

            displayResults();
            document.getElementById('loading').classList.remove('active');
            document.getElementById('results').classList.add('active');
            document.getElementById('exportBtn').disabled = false;
            document.getElementById('printBtn').disabled = false;
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            exportToExcel();
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            window.print();
        });

        async function processPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();
                const text = textContent.items.map(item => item.str).join(' ');
                
                console.log(`=== Page ${pageNum} ===`);
                console.log('Text:', text.substring(0, 500));
                
                const orders = extractOrderData(text);
                if (orders && orders.length > 0) {
                    orders.forEach(order => {
                        extractedData.push(order);
                    });
                }
            }
        }

        function extractOrderData(text) {
            // 空白を正規化
            text = text.replace(/\s+/g, ' ');
            
            console.log('Processing text:', text.substring(0, 300));
            
            // 注文情報
            const orderIdMatch = text.match(/注⽂ID\s*[:：]\s*([A-Z0-9]+)/);
            const orderDateMatch = text.match(/注⽂⽇\s*[:：]\s*(\d{4}\/\d{2}\/\d{2})/);
            
            if (!orderIdMatch) {
                console.log('❌ Order ID not found');
                return [];
            }
            
            console.log('✓ Order ID:', orderIdMatch[1]);
            console.log('✓ Order Date:', orderDateMatch ? orderDateMatch[1] : '');
            
            // お届け先情報の抽出
            const recipientMatch = text.match(/お届け先\s*[:：]\s*(.+?)\s*請求先/);
            let recipientInfo = '';
            
            if (recipientMatch) {
                const section = recipientMatch[1].trim();
                console.log('Raw recipient section:', section);
                
                const lines = [];
                
                // 1. 名前（様の前の2単語）
                const nameMatch = section.match(/([^\s]+)\s+([^\s]+)\s*様/);
                if (nameMatch) {
                    lines.push(`${nameMatch[1]} ${nameMatch[2]} 様`);
                }
                
                // 2. 郵便番号
                const postalMatch = section.match(/〒(\d{7})/);
                if (postalMatch) {
                    lines.push(`〒${postalMatch[1]}`);
                }
                
                // 3. 住所（郵便番号の後、Telの前まで）
                if (postalMatch) {
                    const afterPostalIndex = section.indexOf(postalMatch[0]) + postalMatch[0].length;
                    const afterPostal = section.substring(afterPostalIndex);
                    const telIndex = afterPostal.search(/Tel\s*[:：]/);
                    
                    if (telIndex > 0) {
                        const address = afterPostal.substring(0, telIndex).trim();
                        if (address) {
                            lines.push(address);
                        }
                    }
                }
                
                // 4. Tel（最初に出現する電話番号のみ）
                const telMatch = section.match(/Tel\s*[:：]\s*(\d+)/);
                if (telMatch) {
                    lines.push(`Tel: ${telMatch[1]}`);
                }
                
                // 5. Mail（最初に出現するメールアドレスのみ）
                const mailMatch = section.match(/Mail\s*[:：]\s*([^\s]+@[^\s]+)/);
                if (mailMatch) {
                    lines.push(`Mail: ${mailMatch[1]}`);
                }
                
                recipientInfo = lines.join('\n');
                console.log('✓ Recipient (clean):', lines);
            }
            
            // 商品の抽出（商品テーブルヘッダーの後にある9桁の商品番号から）
            // まず商品テーブルの開始位置を探す
            const tableStartMatch = text.match(/No\.\s+商品名\s+単価\s+数量\s+⼩計\(税込\)/);
            if (!tableStartMatch) {
                console.log('❌ Product table not found');
                return [];
            }
            
            // 商品テーブル以降のテキストのみを対象にする
            const tableText = text.substring(tableStartMatch.index + tableStartMatch[0].length);
            
            const productPattern = /(\d{8,9})\s+(.+?)¥([\d,]+)\s+(\d+)\s+¥([\d,]+)/g;
            const products = [];
            let match;
            
            while ((match = productPattern.exec(tableText)) !== null) {
                const productNum = match[1];
                const productText = match[2].trim();
                const unitPrice = match[3];
                const quantity = match[4];
                const subtotal = match[5];
                
                console.log('Found product:', productNum);
                console.log('Product text:', productText);
                
                // 商品テキストを整形
                const lines = [];
                
                // オプション行を抽出（「名前 : 値(¥金額)」形式）
                // 全ての「: 値(¥金額)」パターンを見つけてから、オプション名を特定
                const colonValuePattern = /[:：]\s*([^:：]+?\(¥[\d,]+\))/g;
                let cvMatch;
                const colonPositions = [];
                
                while ((cvMatch = colonValuePattern.exec(productText)) !== null) {
                    colonPositions.push({
                        colonIndex: cvMatch.index,
                        value: cvMatch[1].trim()
                    });
                }
                
                // 各コロン位置からオプション名を逆算
                const options = [];
                let firstOptionStart = productText.length;
                
                // 既知のオプション名パターン（完全一致または末尾一致）
                const knownOptionNames = [
                    'Hair Oil Pomp', 'Sheer Bag Wrapping', 'Box Wrapping', 'Gift Wrapping',
                    'Aroma Oil', 'Hair Oil', 'Paper Bag', 'Sheer Bag', 'Package Box',
                    'Box', 'Bag'
                ];
                
                // 追加オプション（日本語を含む）
                const additionalPatterns = ['Aroma Oil (追加)'];
                
                for (const pos of colonPositions) {
                    const beforeColon = productText.substring(0, pos.colonIndex).trim();
                    
                    let optionName = null;
                    let optionStart = -1;
                    
                    // まず既知のオプション名パターンをチェック（長いものから）
                    for (const known of knownOptionNames) {
                        if (beforeColon.endsWith(known)) {
                            optionName = known;
                            optionStart = beforeColon.lastIndexOf(known);
                            break;
                        }
                    }
                    
                    // 追加パターンをチェック
                    if (!optionName) {
                        for (const pattern of additionalPatterns) {
                            if (beforeColon.endsWith(pattern)) {
                                optionName = pattern;
                                optionStart = beforeColon.lastIndexOf(pattern);
                                break;
                            }
                        }
                    }
                    
                    // 既知のパターンに一致しない場合、最後の1〜3単語をオプション名とする
                    if (!optionName) {
                        const words = beforeColon.split(/\s+/);
                        const lastWord = words[words.length - 1];
                        
                        // 末尾の単語がオプション名の特徴を持つ場合
                        const optionEndings = ['Oil', 'Bag', 'Wrapping', 'Box', 'Pomp'];
                        
                        if (optionEndings.includes(lastWord)) {
                            // 末尾から2〜3単語をオプション名とする
                            if (words.length >= 3 && ['Wrapping', 'Pomp'].includes(lastWord)) {
                                optionName = words.slice(-3).join(' ');
                            } else if (words.length >= 2) {
                                optionName = words.slice(-2).join(' ');
                            } else {
                                optionName = lastWord;
                            }
                        } else {
                            // 1単語のオプション名
                            optionName = lastWord;
                        }
                        optionStart = beforeColon.lastIndexOf(optionName);
                    }
                    
                    if (optionName && optionStart >= 0) {
                        options.push({
                            name: optionName,
                            value: pos.value,
                            startIndex: optionStart
                        });
                        
                        if (optionStart < firstOptionStart) {
                            firstOptionStart = optionStart;
                        }
                    }
                }
                
                // 商品名を抽出（最初のオプションの開始位置より前）
                let productName = productText;
                let variation = '';
                
                if (options.length > 0 && firstOptionStart > 0) {
                    const beforeFirstOption = productText.substring(0, firstOptionStart).trim();
                    
                    // 商品名の終端パターンを探す
                    // 「Set」「ml」「Mist」「Ylang」「Citrus」「Entrance」で終わる部分を商品名とする
                    const productEndPatterns = ['Set', 'ml', 'Mist', 'Ylang', 'Citrus', 'Entrance', 'Wood', 'Bergamot'];
                    
                    const words = beforeFirstOption.split(/\s+/);
                    let productEndIndex = words.length;
                    
                    for (let i = words.length - 1; i >= 0; i--) {
                        const word = words[i];
                        if (productEndPatterns.some(p => word === p || word.endsWith(p))) {
                            productEndIndex = i + 1;
                            break;
                        }
                        // 「/」や「×」や「+」を含む場合、その前で切らない
                        if (word.includes('/') || word.includes('×') || word.includes('+')) {
                            continue;
                        }
                    }
                    
                    productName = words.slice(0, productEndIndex).join(' ');
                    
                    // バリエーション（商品名の後、オプションの前）
                    if (productEndIndex < words.length) {
                        variation = words.slice(productEndIndex).join(' ');
                    }
                } else if (options.length === 0) {
                    // オプションがない場合
                    // バリエーションが含まれているかチェック
                    const words = productText.split(/\s+/);
                    const variationWords = ['Entrance', 'Bergamot', 'Wood', 'Olive', 'Green', 'Brown', 'Silver'];
                    
                    for (let i = words.length - 1; i >= 0; i--) {
                        if (variationWords.includes(words[i])) {
                            productName = words.slice(0, i).join(' ');
                            variation = words.slice(i).join(' ');
                            break;
                        }
                    }
                }
                
                // 商品名を追加
                lines.push(productName);
                
                // バリエーションがあれば追加
                if (variation) {
                    lines.push(variation);
                }
                
                // オプション行を追加
                options.forEach(opt => {
                    lines.push(`${opt.name} : ${opt.value}`);
                });
                
                products.push({
                    productDetails: lines.join('\n'),
                    quantity: quantity,
                    subtotal: subtotal
                });
                
                console.log('✓ Product lines:', lines);
            }
            
            if (products.length === 0) {
                console.log('❌ No products found');
                return [];
            }
            
            // 送料と合計
            const shippingMatch = text.match(/送料\s*\(税込\)\s*¥([\d,]+)/);
            const totalMatch = text.match(/合計⾦額\s*¥([\d,]+)/);
            
            const shipping = shippingMatch ? shippingMatch[1] : '0';
            const total = totalMatch ? totalMatch[1] : '';
            
            // 各商品を配列に格納
            const allProducts = products.map((product, index) => ({
                orderDate: orderDateMatch ? orderDateMatch[1] : '',
                orderId: orderIdMatch[1],
                recipient: recipientInfo,
                productDetails: product.productDetails,
                quantity: product.quantity,
                subtotal: product.subtotal,
                shipping: index === products.length - 1 ? shipping : '0',
                total: index === products.length - 1 ? total : product.subtotal
            }));
            
            // 複数商品がある場合は1行にまとめる
            if (allProducts.length > 1) {
                // 各商品の詳細を空行で区切って結合
                const combinedProductDetails = allProducts.map(p => p.productDetails).join('\n\n');
                
                const totalQuantity = allProducts.reduce((sum, p) => sum + parseInt(p.quantity), 0);
                const totalSubtotal = allProducts.reduce((sum, p) => sum + parseInt(p.subtotal.replace(/,/g, '')), 0);
                
                return [{
                    orderDate: allProducts[0].orderDate,
                    orderId: allProducts[0].orderId,
                    recipient: allProducts[0].recipient,
                    productDetails: combinedProductDetails,
                    quantity: totalQuantity.toString(),
                    subtotal: totalSubtotal.toLocaleString(),
                    shipping: shipping,
                    total: total
                }];
            }
            
            return allProducts;
        }

        function displayResults() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalOrders = extractedData.length;
            let totalSales = 0;
            let totalShipping = 0;
            let totalProducts = 0;

            extractedData.forEach(order => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${order.orderDate}</td>
                    <td style="font-family: monospace; font-size: 0.85rem;">${order.orderId}</td>
                    <td style="white-space: pre-line; font-size: 0.85rem; line-height: 1.5;">${order.recipient}</td>
                    <td style="white-space: pre-line; line-height: 1.5;">${order.productDetails}</td>
                    <td>${order.quantity}</td>
                `;
                tbody.appendChild(row);

                totalSales += parseInt(order.total.replace(/,/g, '')) || 0;
                totalShipping += parseInt(order.shipping.replace(/,/g, '')) || 0;
                totalProducts += parseInt(order.subtotal.replace(/,/g, '')) || 0;
            });

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalSales').textContent = '¥' + totalSales.toLocaleString();
            document.getElementById('totalShipping').textContent = '¥' + totalShipping.toLocaleString();
            document.getElementById('totalProducts').textContent = '¥' + totalProducts.toLocaleString();
        }

        function exportToExcel() {
            const data = extractedData.map(order => ({
                '注文日': order.orderDate,
                '注文ID': order.orderId,
                'お届け先情報': order.recipient,
                '商品詳細': order.productDetails,
                '数量': order.quantity
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            
            // 列幅を自動調整
            const colWidths = [
                { wch: 12 },  // 注文日
                { wch: 20 },  // 注文ID
                { wch: 40 },  // お届け先情報
                { wch: 60 },  // 商品詳細
                { wch: 8 }    // 数量
            ];
            ws['!cols'] = colWidths;
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '納品書一覧');

            const date = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `納品書一覧_${date}.xlsx`);
        }
    </script>
</body>
